<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Contact form for getting in touch with the student."
    >
    <title>Laboratory 2 — Contacts</title>
    <link rel="icon" href="assets/images/favicon.ico">
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="site-header">
        <h1>Contacts</h1>

        <nav class="site-navigation" aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li>
                    <a href="contacts.html" aria-current="page">Contacts</a>
                </li>
            </ul>
        </nav>
    </header>

    <main id="main">
        <section aria-labelledby="form-title">
            <h2 id="form-title">Contact Form</h2>

            <form action="#" method="get">
                <div class="form-row">
                    <label for="name">Name:</label>
                    <input
                        id="name"
                        type="text"
                        name="name"
                        placeholder="Enter your name"
                        required
                        minlength="2"
                        maxlength="50"
                        pattern="[A-Za-z\s\-'’]+"
                        title="Use letters, spaces, hyphens, or apostrophes"
                    >
                </div>

                <div class="form-row">
                    <label for="email">Email:</label>
                    <input
                        id="email"
                        type="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >
                </div>

                <div class="form-row">
                    <label for="phone">Phone:</label>
                    <input
                        id="phone"
                        type="tel"
                        name="phone"
                        placeholder="+380 XX XXX XX XX"
                        required
                        pattern="\+380[0-9]{9}"
                        title="Enter the number in the format +380XXXXXXXXX"
                    >
                </div>

                <div class="form-row">
                    <label for="message">Comment:</label>
                    <textarea
                        id="message"
                        name="message"
                        placeholder="Enter your message"
                        rows="6"
                        minlength="10"
                        maxlength="500"
                        required
                    ></textarea>
                </div>

                <button type="submit">Send</button>
            </form>
        </section>

        <section aria-labelledby="contact-data-title">
            <h2 id="contact-data-title">My Contacts</h2>
            <address>
                Email:
                <a href="mailto:student@example.com">student@example.com</a>
            </address>
        </section>
    </main>

    <aside>
        <h2>Social Media</h2>
        <ul>
            <li>
                <a
                    href="https://github.com/AlexKrivokorytov"
                    target="_blank"
                    rel="noopener noreferrer"
                >GitHub</a>
            </li>
        </ul>
    </aside>

    <footer class="site-footer">
        <p>Student: Oleksandr Kryvokorytov</p>
        <p>Group: 6.1214-pi2</p>
    </footer>
</body>
</html>
