<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact form to get in touch with the student.">
    <title>Lab 3 — Contacts</title>
    <link rel="icon" href="assets/images/favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page">
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="header">
        <h1 class="header__title">Contacts</h1>
        <nav class="navigation" aria-label="Main navigation">
            <ul class="navigation__list">
                <li class="navigation__item"><a class="navigation__link" href="index.html">Home</a></li>
                <li class="navigation__item"><a class="navigation__link" href="about.html">About me</a></li>
                <li class="navigation__item"><a class="navigation__link navigation__link--active" href="contacts.html" aria-current="page">Contacts</a></li>
            </ul>
        </nav>
    </header>

    <main class="main" id="main">
        <h2 class="main__title">Feedback form</h2>

        <form class="contact-form" action="#" method="get">
            <div class="contact-form__item">
                <label class="contact-form__label" for="name">Name:</label>
                <input class="contact-form__input" id="name" type="text" name="name" placeholder="Enter your name" required minlength="2" maxlength="50" pattern="[A-Za-z\s\-'’]+" title="Use letters, spaces, dashes, or apostrophes">
            </div>

            <div class="contact-form__item">
                <label class="contact-form__label" for="email">Email:</label>
                <input class="contact-form__input" id="email" type="email" name="email" placeholder="example@email.com" required>
            </div>

            <div class="contact-form__item">
                <label class="contact-form__label" for="phone">Phone:</label>
                <input class="contact-form__input" id="phone" type="tel" name="phone" placeholder="+380XXXXXXXXX" required pattern="\+380[0-9]{9}" title="Enter a number in the format +380XXXXXXXXX">
            </div>

            <div class="contact-form__item">
                <label class="contact-form__label" for="message">Message:</label>
                <textarea class="contact-form__textarea" id="message" name="message" placeholder="Enter your message" rows="6" minlength="10" maxlength="500" required></textarea>
            </div>

            <button class="contact-form__button" type="submit">Send</button>
        </form>
    </main>

    <aside class="sidebar sidebar--social">
        <h2 class="sidebar__title">Social networks</h2>
        <ul class="sidebar__list">
            <li class="sidebar__item"><a class="sidebar__link" href="https://github.com/AlexKrivokorytov" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        </ul>
    </aside>

    <footer class="footer">
        <p class="footer__text">Student: Alexander Krivokorytov</p>
        <p class="footer__text">Group: 6.1214-pi2</p>
    </footer>
</body>
</html>
